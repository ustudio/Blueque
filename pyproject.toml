[project]
name = "blueque"
version = "1.0.1"
description = "Simple job queueing for very long tasks"
authors = [
    { name = "uStudio Developers", email = "<dev@ustudio.com>" }
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "redis (>=5.0.1,<6.0)"
]

[project.optional-dependencies]
dev = [
    "pytest (>=7.4.3,<8)",
    "flake8  (>=6.1.0,<7)"
]

[tool.poetry]
packages = [{include = "blueque"}]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
