version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip-production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      pip-development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - "*"
